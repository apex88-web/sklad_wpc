<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sklad WPC a Príslušenstva</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f4f6f8; 
      margin: 0; 
      padding: 15px; 
    }
    .container { 
      max-width: 800px; 
      margin: auto; 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); 
    }
   .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      gap: 15px;
      flex-wrap: wrap;
    }
    .header-branding {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-logos {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      height: 38px;          /* Zjednotená výška pre obe logá */
      width: auto;           /* Zachová správny pomer strán */
      object-fit: contain;
      display: block;
    }
    h1 { font-size: 22px; color: #222; margin: 0; }
    h2 { font-size: 18px; color: #333; margin-top: 0; }
    .card { 
      background: #fafafa; 
      border: 1px solid #e1e4e8; 
      border-radius: 6px; 
      padding: 16px; 
      margin-bottom: 20px; 
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    select, input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box; 
      font-size: 16px; 
    }
    button { 
      background: #0066cc; 
      color: white; 
      border: none; 
      padding: 12px 20px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%;
    }
    button:hover { background: #0052a3; }
    button:disabled { background: #999; }
    .btn-logout {
      background: transparent;
      color: #888;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
      border-radius: 4px;
    }
    .btn-logout:hover { background: #fee; color: #c00; border-color: #fcc; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e1e4e8; font-size: 15px; }
    th { background: #f0f2f5; }
    .stock-badge { 
      display: inline-block; 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-weight: bold; 
      font-size: 14px;
    }
    .stock-ok { background: #e6f4ea; color: #137333; }
    .stock-low { background: #fce8e6; color: #c5221f; }
    
    /* Sekcia prihlásenia PINom */
    #loginSection {
      max-width: 360px;
      margin: 40px auto;
      text-align: center;
    }
    #pinInput {
      text-align: center;
      letter-spacing: 6px;
      font-size: 24px;
      margin-bottom: 15px;
    }
   /* Položka, z ktorej sa ešte nič nevydalo */
    .dispatch-badge-zero {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 14px;
      background: #f1f5f9;
      color: #94a3b8;
    }
    /* Položka, z ktorej už bol realizovaný výdaj (červené podsvietenie) */
    .dispatch-badge-active {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    /* Obal pre pruhový graf v riadku */
    .bar-container {
      width: 100%;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      height: 7px;
      display: flex;
      margin-top: 6px;
    }
    .bar-stock {
      background: #16a34a; /* Zelená - skladom */
      height: 100%;
      transition: width 0.3s ease;
    }
    .bar-dispatched {
      background: #dc2626; /* Červená - vydané */
      height: 100%;
      transition: width 0.3s ease;
    }
    .item-meta {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. OBRAZOVKA PRIHLÁSENIA S PINOM -->
  <div id="loginSection" class="card">
    <h2>Prístup do skladu</h2>
    <p style="color:#666; font-size:14px;">Zadajte overovací PIN kód</p>
    <form id="pinForm">
      <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" required autofocus>
      <button type="submit" id="pinBtn">Odomknúť sklad</button>
      <div id="pinError" style="color:red; font-size:14px; margin-top:10px; display:none;"></div>
    </form>
  </div>

  <!-- 2. HLAVNÁ APLIKÁCIA SKLADU (pred odomknutím skrytá) -->
  <div class="header-bar">
      <div class="header-branding">
        <div class="header-logos">
          <!-- Logo 1: wpcdrevoplasty.sk -->
          <img src="main_logo_wpcdrevoplasty.png" alt="WPC Drevoplasty" class="header-logo">
          <!-- Logo 2: wpcdosky.sk -->
          <img src="logo-wpc.png" alt="WPC Dosky" class="header-logo">
        </div>
        <h1>Skladová evidencia</h1>
      </div>
      <button class="btn-logout" onclick="logout()">Zamknúť 🔒</button>
    </div>

    <!-- Formulár pre výdaj -->
    <div class="card">
      <h2>Vyskladnenie materiálu</h2>
      <form id="dispatchForm">
        <div class="form-group">
          <label for="itemSelect">Položka</label>
          <select id="itemSelect" required>
            <option value="">Načítavam skladové položky...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Množstvo na výdaj</label>
          <input type="number" id="amount" min="1" step="any" placeholder="Zadajte počet kusov" required>
        </div>

        <div class="form-group">
          <label for="note">Poznámka / Zákazka</label>
          <input type="text" id="note" placeholder="Napr. Terasa Žilina">
        </div>

        <button type="submit" id="submitBtn">Potvrdiť výdaj zo skladu</button>
      </form>
    </div>

 <!-- 1. TABUĽKA: AKTUÁLNY STAV SKLADU -->
    <h2>Aktuálny stav skladu <span id="lastUpdated" style="font-size: 13px; font-weight: normal; color: #666; margin-left: 8px;"></span></h2>
    <table id="stockTable">
      <thead>
        <tr>
          <th>Názov</th>
          <th>Skladom</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="2">Načítavam dáta...</td></tr>
      </tbody>
    </table>

    <div style="height: 30px;"></div>

    <!-- 2. TABUĽKA: CELKOVO VYDANÉ ZO SKLADU -->
    <h2>Celkovo vydané zo skladu</h2>
    <table id="dispatchedTable">
      <thead>
        <tr>
          <th>Názov</th>
          <th>Vydané</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="2">Načítavam dáta...</td></tr>
      </tbody>
    </table>

<script>
  // Doplňte vašu overenú URL adresu z Apps Scriptu končiacu na /exec
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaHrYNWoJzN2hqbD36SF65IQnjHUhjG5vVr35VajUdXWY6gXoVU4TJnNcBkJQreriA/exec";

  let inventory = [];
  let currentPin = localStorage.getItem("sklad_pin") || "";

  // Kontrola pri načítaní stránky
  window.addEventListener("DOMContentLoaded", () => {
    if (currentPin) {
      unlockAppAndLoad();
    } else {
      showLogin();
    }
  });

  function showLogin(errMsg = "") {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("appSection").style.display = "none";
    const errEl = document.getElementById("pinError");
    if (errMsg) {
      errEl.textContent = errMsg;
      errEl.style.display = "block";
    } else {
      errEl.style.display = "none";
    }
    document.getElementById("pinInput").value = "";
  }

  function unlockAppAndLoad() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    loadStock();
  }

function logout() {
    localStorage.removeItem("sklad_pin");
    currentPin = "";
    inventory = [];
    const select = document.getElementById("itemSelect");
    if (select) select.innerHTML = '<option value="">Načítavam skladové položky...</option>';
    
    const stockTbody = document.querySelector("#stockTable tbody");
    if (stockTbody) stockTbody.innerHTML = '<tr><td colspan="2">Načítavam dáta...</td></tr>';
    
    const dispatchTbody = document.querySelector("#dispatchedTable tbody");
    if (dispatchTbody) dispatchTbody.innerHTML = '<tr><td colspan="2">Načítavam dáta...</td></tr>';
    
    showLogin("Sklad bol uzamknutý.");
  }

  // Odoslanie PINu
  document.getElementById("pinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const pinVal = document.getElementById("pinInput").value.trim();
    if (!pinVal) return;
    currentPin = pinVal;
    unlockAppAndLoad();
  });

  // Načítanie zásob cez JSONP vrátane overenia PINu
  // Načítanie zásob cez JSONP s čistým prepisom
function loadStock() {
    const stockTbody = document.querySelector("#stockTable tbody");
    const dispatchTbody = document.querySelector("#dispatchedTable tbody");

    // Nastavíme hlásenie do oboch tabuliek súčasne
    if (stockTbody) stockTbody.innerHTML = '<tr><td colspan="2">Overujem PIN a sťahujem zásoby...</td></tr>';
    if (dispatchTbody) dispatchTbody.innerHTML = '<tr><td colspan="2">Overujem PIN a sťahujem výdaje...</td></tr>';

    // 1. Dôkladné odstránenie starého script tagu, ak existuje
    const existingScript = document.getElementById("jsonp-stock");
    if (existingScript) {
      existingScript.remove();
    }

    // 2. Unikátny názov funkcie pre každé volanie
    const callbackName = "onStockLoaded_" + Date.now();

    window[callbackName] = function(res) {
      delete window[callbackName];
      const s = document.getElementById("jsonp-stock");
      if (s) s.remove();

      if (res && res.status === "auth_error") {
        localStorage.removeItem("sklad_pin");
        currentPin = "";
        showLogin("Nesprávny prístupový PIN kód.");
        return;
      }

      if (res && res.status === "success" && Array.isArray(res.data)) {
        localStorage.setItem("sklad_pin", currentPin);
        inventory = res.data;
        renderUI();
      } else {
        if (stockTbody) stockTbody.innerHTML = '<tr><td colspan="2" style="color:red;">Chyba spracovania dát.</td></tr>';
        if (dispatchTbody) dispatchTbody.innerHTML = '<tr><td colspan="2" style="color:red;">Chyba spracovania dát.</td></tr>';
      }
    };

    // 3. Pripojenie nového skriptu
    const script = document.createElement("script");
    script.id = "jsonp-stock";
    const sep = SCRIPT_URL.includes("?") ? "&" : "?";
    
    script.src = `${SCRIPT_URL}${sep}akcia=nacitaj&pin=${encodeURIComponent(currentPin)}&callback=${callbackName}&t=${Date.now()}`;
    
    script.onerror = function() {
      delete window[callbackName];
      script.remove();
      if (stockTbody) stockTbody.innerHTML = '<tr><td colspan="2" style="color:red; font-weight:bold;">Chyba spojenia so serverom.</td></tr>';
      if (dispatchTbody) dispatchTbody.innerHTML = '<tr><td colspan="2" style="color:red; font-weight:bold;">Chyba spojenia so serverom.</td></tr>';
    };

    document.body.appendChild(script);
  }

function renderUI() {
    const now = new Date();
    const formattedTime = now.toLocaleDateString('sk-SK') + ', ' + now.toLocaleTimeString('sk-SK');
    const updateEl = document.getElementById("lastUpdated");
    if (updateEl) updateEl.textContent = `(k ${formattedTime})`;

    const select = document.getElementById("itemSelect");
    select.innerHTML = '<option value="">-- Vyberte položku --</option>';
    
    const stockTbody = document.querySelector("#stockTable tbody");
    const dispatchTbody = document.querySelector("#dispatchedTable tbody");
    
    stockTbody.innerHTML = "";
    dispatchTbody.innerHTML = "";

    if (!inventory || inventory.length === 0) {
      stockTbody.innerHTML = '<tr><td colspan="2">V tabuľke nie sú žiadne skladové položky.</td></tr>';
      dispatchTbody.innerHTML = '<tr><td colspan="2">Žiadne záznamy.</td></tr>';
      return;
    }

    inventory.forEach(item => {
      const mnozstvo = Number(item.mnozstvo) || 0;
      const vydane = Number(item.vydane) || 0;
      const celkovyPohyb = mnozstvo + vydane;

      // Výpočet percentuálneho pomeru pre grafický pásik
      let skladPct = 100;
      let vydajPct = 0;
      if (celkovyPohyb > 0) {
        skladPct = Math.round((mnozstvo / celkovyPohyb) * 100);
        vydajPct = 100 - skladPct;
      }

      let dlzka = parseFloat(String(item.dlzka_m || "").replace(",", ".")) || 0;
      if (dlzka > 50) dlzka = 0;

      let textZasoby = `${mnozstvo} ${item.jednotka || 'ks'}`;
      let textVydane = `${vydane} ${item.jednotka || 'ks'}`;

      if (dlzka > 0) {
        const celkovoBm = Math.round((mnozstvo * dlzka) * 100) / 100;
        const vydaneBm = Math.round((vydane * dlzka) * 100) / 100;
        const kat = (item.kategoria || "").trim().toLowerCase();
        
        if (kat === "doska" || kat === "dosky") {
          // Automatické vyťaženie šírky z názvu (napr. z "148*23*5000" vezme 148 mm -> 0.148 m)
          const match = item.nazov.match(/(\d+)\s*\*\s*\d+\s*\*\s*\d+/);
          const sirkaM = match ? (parseFloat(match[1]) / 1000) : 0.148;

          const plochaM2 = Math.round((celkovoBm * sirkaM) * 100) / 100;
          const vydaneM2 = Math.round((vydaneBm * sirkaM) * 100) / 100;

          textZasoby += ` (${celkovoBm} bm | ${plochaM2} m²)`;
          textVydane += ` (${vydaneBm} bm | ${vydaneM2} m²)`;
        } else {
          textZasoby += ` (${celkovoBm} bm)`;
          textVydane += ` (${vydaneBm} bm)`;
        }
      }

      // Výberové pole (vynechaná WPC_hneda)
      if (item.id.toLowerCase() !== "wpc_hneda") {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = `${item.nazov} (Skladom: ${textZasoby})`;
        select.appendChild(opt);
      }

      // 1. Tabuľka: Aktuálny stav skladu
      const trStock = document.createElement("tr");
      const badgeClass = mnozstvo > 10 ? "stock-ok" : "stock-low";
      trStock.innerHTML = `
        <td>
          <strong>${item.nazov}</strong>
          <div class="bar-container">
            <div class="bar-stock" style="width: ${skladPct}%;"></div>
            <div class="bar-dispatched" style="width: ${vydajPct}%;"></div>
          </div>
          <div class="item-meta">
            <span>Sklad: ${skladPct}%</span>
            <span>Vydané: ${vydajPct}%</span>
          </div>
        </td>
        <td style="vertical-align: top;"><span class="stock-badge ${badgeClass}">${textZasoby}</span></td>
      `;
      stockTbody.appendChild(trStock);

      // 2. Tabuľka: Celkovo vydané zo skladu
      const trDispatch = document.createElement("tr");
      const dispatchBadgeClass = vydane > 0 ? "dispatch-badge-active" : "dispatch-badge-zero";
      trDispatch.innerHTML = `
        <td><strong>${item.nazov}</strong></td>
        <td><span class="${dispatchBadgeClass}">${textVydane}</span></td>
      `;
      dispatchTbody.appendChild(trDispatch);
    });
  }
  
  // Obsluha odoslania formulára pre výdaj materiálu
  document.getElementById("dispatchForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const itemId = document.getElementById("itemSelect").value;
    const amountVal = parseFloat(document.getElementById("amount").value);
    const noteVal = document.getElementById("note").value.trim();
    const submitBtn = document.getElementById("submitBtn");

    if (!itemId) {
      alert("Vyberte položku na výdaj.");
      return;
    }

    if (isNaN(amountVal) || amountVal <= 0) {
      alert("Zadajte platné množstvo väčšie ako 0.");
      return;
    }

    // Deaktivácia tlačidla počas odosielania
    submitBtn.disabled = true;
    submitBtn.textContent = "Odosielam výdaj...";

    // 1. Odstránenie starého skriptu výdaja, ak existuje
    const oldScript = document.getElementById("jsonp-dispatch");
    if (oldScript) oldScript.remove();

    // 2. Unikátny callback pre výdaj
    const dispatchCallback = "onDispatchDone_" + Date.now();

    window[dispatchCallback] = function(res) {
      delete window[dispatchCallback];
      const s = document.getElementById("jsonp-dispatch");
      if (s) s.remove();

      submitBtn.disabled = false;
      submitBtn.textContent = "Potvrdiť výdaj zo skladu";

      if (res && res.status === "auth_error") {
        alert("Chyba overenia: Neplatný PIN kód.");
        logout();
        return;
      }

      if (res && res.status === "success") {
        alert(`Výdaj úspešný!\nPoložka: ${res.nazov}\nNová zásoba: ${res.novaZasoba}`);
        // Reset formulára
        document.getElementById("amount").value = "";
        document.getElementById("note").value = "";
        // Znovunačítanie oboch tabuliek (sklad aj vydané)
        loadStock();
      } else {
        alert("Chyba pri výdaji: " + (res && res.message ? res.message : "Neznáma chyba"));
      }
    };

    // 3. Odoslanie cez JSONP do Apps Scriptu
    const script = document.createElement("script");
    script.id = "jsonp-dispatch";
    const sep = SCRIPT_URL.includes("?") ? "&" : "?";
    
    const params = new URLSearchParams({
      akcia: "vydaj",
      id: itemId,
      mnozstvo: amountVal,
      poznamka: noteVal,
      pin: currentPin,
      callback: dispatchCallback,
      t: Date.now()
    });

    script.src = `${SCRIPT_URL}${sep}${params.toString()}`;

    script.onerror = function() {
      delete window[dispatchCallback];
      script.remove();
      submitBtn.disabled = false;
      submitBtn.textContent = "Potvrdiť výdaj zo skladu";
      alert("Chyba spojenia so serverom pri odosielaní výdaja.");
    };

    document.body.appendChild(script);
  });
</script>
</body>
</html>
