<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklad WPC a Príslušenstva</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f4f6f8; 
      margin: 0; 
      padding: 15px; 
    }
    .container { 
      max-width: 800px; 
      margin: auto; 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); 
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    h1 { font-size: 22px; color: #222; margin: 0; }
    h2 { font-size: 18px; color: #333; margin-top: 0; }
    .card { 
      background: #fafafa; 
      border: 1px solid #e1e4e8; 
      border-radius: 6px; 
      padding: 16px; 
      margin-bottom: 20px; 
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    select, input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box; 
      font-size: 16px; 
    }
    button { 
      background: #0066cc; 
      color: white; 
      border: none; 
      padding: 12px 20px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%;
    }
    button:hover { background: #0052a3; }
    button:disabled { background: #999; }
    .btn-logout {
      background: transparent;
      color: #888;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
      border-radius: 4px;
    }
    .btn-logout:hover { background: #fee; color: #c00; border-color: #fcc; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e1e4e8; font-size: 15px; }
    th { background: #f0f2f5; }
    .stock-badge { 
      display: inline-block; 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-weight: bold; 
      font-size: 14px;
    }
    .stock-ok { background: #e6f4ea; color: #137333; }
    .stock-low { background: #fce8e6; color: #c5221f; }
    
    /* Sekcia prihlásenia PINom */
    #loginSection {
      max-width: 360px;
      margin: 40px auto;
      text-align: center;
    }
    #pinInput {
      text-align: center;
      letter-spacing: 6px;
      font-size: 24px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. OBRAZOVKA PRIHLÁSENIA S PINOM -->
  <div id="loginSection" class="card">
    <h2>Prístup do skladu</h2>
    <p style="color:#666; font-size:14px;">Zadajte overovací PIN kód</p>
    <form id="pinForm">
      <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" required autofocus>
      <button type="submit" id="pinBtn">Odomknúť sklad</button>
      <div id="pinError" style="color:red; font-size:14px; margin-top:10px; display:none;"></div>
    </form>
  </div>

  <!-- 2. HLAVNÁ APLIKÁCIA SKLADU (pred odomknutím skrytá) -->
  <div id="appSection" style="display: none;">
    <div class="header-bar">
      <h1>Skladová evidencia</h1>
      <button class="btn-logout" onclick="logout()">Zamknúť 🔒</button>
    </div>

    <!-- Formulár pre výdaj -->
    <div class="card">
      <h2>Vyskladnenie materiálu</h2>
      <form id="dispatchForm">
        <div class="form-group">
          <label for="itemSelect">Položka</label>
          <select id="itemSelect" required>
            <option value="">Načítavam skladové položky...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Množstvo na výdaj</label>
          <input type="number" id="amount" min="1" step="any" placeholder="Zadajte počet kusov" required>
        </div>

        <div class="form-group">
          <label for="note">Poznámka / Zákazka</label>
          <input type="text" id="note" placeholder="Napr. Terasa Žilina">
        </div>

        <button type="submit" id="submitBtn">Potvrdiť výdaj zo skladu</button>
      </form>
    </div>

    <!-- Tabuľka zásob -->
    <h2>Aktuálny stav skladu <span id="lastUpdated" style="font-size: 13px; font-weight: normal; color: #666; margin-left: 8px;"></span></h2>
    <table id="stockTable">
      <thead>
        <tr>
          <th>Názov</th>
          <th>Zásoba</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="2">Načítavam dáta...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // Doplňte vašu overenú URL adresu z Apps Scriptu končiacu na /exec
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGD1Uj0GPx_Hkfc0HrgqvPr5ytp0py8Gdfk7Tk4UE5nQCiu-jyk1c5Wm6s2tfyh0_J/exec";

  let inventory = [];
  let currentPin = localStorage.getItem("sklad_pin") || "";

  // Kontrola pri načítaní stránky
  window.addEventListener("DOMContentLoaded", () => {
    if (currentPin) {
      unlockAppAndLoad();
    } else {
      showLogin();
    }
  });

  function showLogin(errMsg = "") {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("appSection").style.display = "none";
    const errEl = document.getElementById("pinError");
    if (errMsg) {
      errEl.textContent = errMsg;
      errEl.style.display = "block";
    } else {
      errEl.style.display = "none";
    }
    document.getElementById("pinInput").value = "";
  }

  function unlockAppAndLoad() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    loadStock();
  }

  function logout() {
    localStorage.removeItem("sklad_pin");
    currentPin = "";
    showLogin("Sklad bol uzamknutý.");
  }

  // Odoslanie PINu
  document.getElementById("pinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const pinVal = document.getElementById("pinInput").value.trim();
    if (!pinVal) return;
    currentPin = pinVal;
    unlockAppAndLoad();
  });

  // Načítanie zásob cez JSONP vrátane overenia PINu
  function loadStock() {
    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = '<tr><td colspan="2">Overujem PIN a sťahujem zásoby...</td></tr>';

    window.onStockLoaded = function(res) {
      if (res && res.status === "auth_error") {
        localStorage.removeItem("sklad_pin");
        currentPin = "";
        showLogin("Nesprávny prístupový PIN kód.");
        return;
      }

      if (res && res.status === "success" && Array.isArray(res.data)) {
        // PIN bol správny, zapamätáme ho v telefóne
        localStorage.setItem("sklad_pin", currentPin);
        inventory = res.data;
        renderUI();
      } else {
        tbody.innerHTML = '<tr><td colspan="2" style="color:red;">Chyba spracovania dát.</td></tr>';
      }

      const oldScript = document.getElementById("jsonp-stock");
      if (oldScript) oldScript.remove();
    };

    const oldScript = document.getElementById("jsonp-stock");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "jsonp-stock";
    const sep = SCRIPT_URL.includes("?") ? "&" : "?";
    script.src = `${SCRIPT_URL}${sep}akcia=nacitaj&pin=${encodeURIComponent(currentPin)}&callback=onStockLoaded&t=${Date.now()}`;
    script.onerror = function() {
      tbody.innerHTML = '<tr><td colspan="2" style="color:red; font-weight:bold;">Chyba spojenia so serverom.</td></tr>';
    };
    document.body.appendChild(script);
  }

  function renderUI() {
    const now = new Date();
    const formattedTime = now.toLocaleDateString('sk-SK') + ', ' + now.toLocaleTimeString('sk-SK');
    const updateEl = document.getElementById("lastUpdated");
    if (updateEl) updateEl.textContent = `(k ${formattedTime})`;

    const select = document.getElementById("itemSelect");
    select.innerHTML = '<option value="">-- Vyberte položku --</option>';
    
    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    if (!inventory || inventory.length === 0) {
      tbody.innerHTML = '<tr><td colspan="2">V tabuľke nie sú žiadne skladové položky.</td></tr>';
      return;
    }

    inventory.forEach(item => {
      let textZasoby = `${item.mnozstvo} ${item.jednotka || 'ks'}`;

      if (item.dlzka_m > 0) {
        const celkovoBm = Math.round((item.mnozstvo * item.dlzka_m) * 100) / 100;
        const kat = (item.kategoria || "").trim().toLowerCase();
        
        if (kat === "doska" || kat === "dosky") {
          const plochaM2 = Math.round((celkovoBm * 0.150) * 100) / 100;
          textZasoby += ` (${celkovoBm} bm | ${plochaM2} m²)`;
        } else {
          textZasoby += ` (${celkovoBm} bm)`;
        }
      }

      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = `${item.nazov} (Skladom: ${textZasoby})`;
      select.appendChild(opt);

      const tr = document.createElement("tr");
      const badgeClass = item.mnozstvo > 10 ? "stock-ok" : "stock-low";
      tr.innerHTML = `
        <td><strong>${item.nazov}</strong></td>
        <td><span class="stock-badge ${badgeClass}">${textZasoby}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Spracovanie výdaja
  document.getElementById("dispatchForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Odosielam výdaj...";

    const itemId = document.getElementById("itemSelect").value;
    const amountVal = document.getElementById("amount").value;
    const noteVal = document.getElementById("note").value;

    window.onDispatchComplete = function(res) {
      btn.disabled = false;
      btn.textContent = "Potvrdiť výdaj zo skladu";

      if (res && res.status === "auth_error") {
        logout();
        return;
      }

      if (res && res.status === "success") {
        alert("Výdaj zapísaný! Nový stav položky " + res.nazov + ": " + res.novaZasoba);
        document.getElementById("dispatchForm").reset();
        loadStock();
      } else {
        alert("Chyba: " + (res.message || "Neznáma chyba"));
      }

      const el = document.getElementById("jsonp-dispatch");
      if (el) el.remove();
    };

    const oldEl = document.getElementById("jsonp-dispatch");
    if (oldEl) oldEl.remove();

    const script = document.createElement("script");
    script.id = "jsonp-dispatch";
    const sep = SCRIPT_URL.includes("?") ? "&" : "?";
    
    const query = [
      "akcia=vydaj",
      "pin=" + encodeURIComponent(currentPin),
      "id=" + encodeURIComponent(itemId),
      "mnozstvo=" + encodeURIComponent(amountVal),
      "poznamka=" + encodeURIComponent(noteVal),
      "callback=onDispatchComplete",
      "t=" + Date.now()
    ].join("&");

    script.src = SCRIPT_URL + sep + query;
    script.onerror = function() {
      btn.disabled = false;
      btn.textContent = "Potvrdiť výdaj zo skladu";
      alert("Nepodarilo sa spojiť so skriptom.");
    };

    document.body.appendChild(script);
  });
</script>
</body>
</html>
